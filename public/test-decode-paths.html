function unpackBitsToImageData(base64Bits, size) {
  const packed = Uint8Array.from(atob(base64Bits), (c) => c.charCodeAt(0));
  const imgData = new ImageData(size, size);
  for (let idx = 0; idx < size * size; idx++) {
    const dark = (packed[idx >> 3] >> (idx & 7)) & 1;
    const v = dark ? 0 : 255;
    imgData.data[idx * 4] = v;
    imgData.data[idx * 4 + 1] = v;
    imgData.data[idx * 4 + 2] = v;
    imgData.data[idx * 4 + 3] = 255;
  }
  return imgData;
}

function bytesToStr(arr) { return '[' + Array.from(arr).join(',') + ']'; }
function arraysEqual(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}
function row(title, bodyHtml, status) {
  const div = document.createElement('div');
  div.className = 'row ' + status;
  div.innerHTML = '<h2>' + title + '</h2>' + bodyHtml;
  return div;
}

async function runTest(key) {
  const { label, expected, size, bits } = PAYLOADS[key];
  const canvas = document.getElementById('qr');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const imgData = unpackBitsToImageData(bits, size);
  ctx.putImageData(imgData, 0, 0);

  const out = document.getElementById('results');
  out.innerHTML = '';
  out.appendChild(row('Payload (' + label + ')', '<pre>' + bytesToStr(expected) + '</pre>', 'neutral'));

  // --- jsQR ---
  try {
    const jsqrResult = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'dontInvert' });
    if (!jsqrResult) {
      out.appendChild(row('jsQR', 'não decodificou nada', 'fail'));
    } else {
      const ok = arraysEqual(Array.from(jsqrResult.binaryData), expected);
      out.appendChild(row('jsQR (binaryData)', '<pre>' + bytesToStr(jsqrResult.binaryData) + '</pre>' + (ok ? 'BATE COM O ORIGINAL' : 'DIVERGIU'), ok ? 'ok' : 'fail'));
    }
  } catch (e) {
    out.appendChild(row('jsQR', 'erro: ' + e.message, 'fail'));
  }

  // --- BarcodeDetector ---
  if (typeof BarcodeDetector === 'undefined') {
    out.appendChild(row('BarcodeDetector', 'API não existe neste navegador', 'neutral'));
    return;
  }
  try {
    const formats = await BarcodeDetector.getSupportedFormats();
    if (!formats.includes('qr_code')) {
      out.appendChild(row('BarcodeDetector', 'existe mas não suporta qr_code. Formatos: ' + formats.join(', '), 'neutral'));
      return;
    }
    const detector = new BarcodeDetector({ formats: ['qr_code'] });
    const results = await detector.detect(canvas);
    if (results.length === 0) {
      out.appendChild(row('BarcodeDetector', 'não achou nenhum código', 'fail'));
      return;
    }
    const rawValue = results[0].rawValue;
    const codeUnits = [];
    for (let i = 0; i < rawValue.length; i++) codeUnits.push(rawValue.charCodeAt(i));

    let recovered = null;
    if (codeUnits.every((c) => c <= 0xff)) recovered = codeUnits;
    const recoveredOk = recovered !== null && arraysEqual(recovered, expected);

    out.appendChild(
      row(
        'BarcodeDetector.rawValue — code units (UTF-16)',
        '<pre>' + bytesToStr(codeUnits) + '</pre>' +
        'comprimento da string: ' + rawValue.length + ' (esperado ' + expected.length + ' bytes)<br>' +
        (recovered === null
          ? 'REJEITADO pelo safety-check atual (algum code point > 0xff) — cai pro fallback jsQR, comportamento seguro'
          : recoveredOk
            ? 'reconstrução via charCodeAt() BATE COM O ORIGINAL — hipótese ISO-8859-1 confirmada'
            : 'reconstrução via charCodeAt() ACEITA SILENCIOSAMENTE E ERRADA: ' + bytesToStr(recovered) + ' — hipótese UTF-8-com-fallback CONFIRMADA, bug real'),
        recovered === null ? 'neutral' : recoveredOk ? 'ok' : 'fail',
      ),
    );
  } catch (e) {
    out.appendChild(row('BarcodeDetector', 'erro: ' + e.message, 'fail'));
  }
}

let current = 'adversarial';
window.addEventListener('load', () => {
  runTest(current);
  document.getElementById('toggle').onclick = () => {
    current = current === 'adversarial' ? 'protocol' : 'adversarial';
    runTest(current);
  };
});
